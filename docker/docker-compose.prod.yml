version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: linkdrop-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: linkdrop_prod
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - linkdrop-network
    # Don't expose port in production - only internal access

  redis:
    image: redis:7.2-alpine
    container_name: linkdrop-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - linkdrop-network

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: linkdrop-api-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/linkdrop_prod?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - linkdrop-network

  nginx:
    image: nginx:alpine
    container_name: linkdrop-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - linkdrop-network

volumes:
  mongodb_data_prod:
  redis_data_prod:

networks:
  linkdrop-network:
    driver: bridge