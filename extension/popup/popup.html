<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkDrop</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading" class="screen">
            <div class="spinner"></div>
            <p>Loading LinkDrop...</p>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <div class="header">
                <h1>Welcome to LinkDrop</h1>
                <p>Share links with your friends instantly</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="primary-button">Log In</button>
                <p class="auth-switch">
                    Don't have an account? <a href="#" id="show-register">Register</a>
                </p>
            </form>
        </div>

        <!-- Register Screen -->
        <div id="register-screen" class="screen hidden">
            <div class="header">
                <h1>Create Account</h1>
                <p>Join LinkDrop to share links with friends</p>
            </div>
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose a username">
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Choose a password">
                </div>
                <button type="submit" class="primary-button">Register</button>
                <p class="auth-switch">
                    Already have an account? <a href="#" id="show-login">Log In</a>
                </p>
            </form>
        </div>

        <!-- Main Screen -->
        <div id="main-screen" class="screen hidden">
            <!-- Header -->
            <div class="header">
                <div class="user-info">
                    <div class="user-profile">
                        <div class="avatar-wrapper">
                            <div class="avatar-fallback">
                                <span class="initials"></span>
                            </div>
                            <img id="user-avatar" class="avatar" alt="Avatar">
                            <div class="status-indicator"></div>
                        </div>
                        <div class="user-details">
                            <span id="username" class="username">Loading...</span>
                            <span class="user-status">Online</span>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button id="notification-btn" class="icon-button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="notification-badge"></span>
                        </button>
                        <button id="actual-logout-btn" class="icon-button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Share Section -->
            <div class="share-section">
                <div class="section-header">
                    <div class="tabs">
                        <button id="friends-tab" class="tab active">Friends</button>
                        <button id="groups-tab" class="tab">Groups</button>
                    </div>
                    <div class="search-box">
                        <input type="text" id="friend-search" placeholder="Search friends...">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                </div>

                <!-- Friends List -->
                <div id="friends-section" class="share-tab-content active">
                    <div class="friends-list" id="friends-list">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <span>Loading friends...</span>
                        </div>
                    </div>
                </div>

                <!-- Groups List -->
                <div id="groups-section" class="share-tab-content">
                    <div class="groups-list" id="groups-list">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <span>Loading groups...</span>
                        </div>
                    </div>
                </div>

                <div class="share-actions">
                    <div class="note-input">
                        <textarea 
                            id="share-note" 
                            placeholder="Add a note (optional)..." 
                            rows="2" 
                            maxlength="500"
                        ></textarea>
                        <div class="note-input-footer">
                            <div class="note-input-icons">
                                <button class="note-emoji-btn" title="Add emoji">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                        <line x1="9" y1="9" x2="9.01" y2="9"/>
                                        <line x1="15" y1="9" x2="15.01" y2="9"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="char-count">0/500</span>
                        </div>
                    </div>
                    <button id="share-btn" class="primary-button" disabled>
                        Share Link
                    </button>
                </div>
            </div>

            <!-- Recent Links -->
            <div class="recent-links">
                <div class="section-header">
                    <small class="recent-label">Recent</small>
                    <button id="refresh-links" class="icon-button" title="Refresh">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                    </button>
                </div>
                <div class="links-list" id="links-list">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <button id="open-dashboard" class="secondary-button">
                    <svg class="button-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span class="button-text">Open Dashboard</span>
                </button>
            </div>
        </div>

        <!-- Toast Messages -->
        <div id="toast-container" class="toast-container">
            <div id="success-message" class="toast hidden">
                <svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20,6 9,17 4,12"/>
                </svg>
                <span class="toast-text"></span>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>

    <style>
    /* Add these styles to your existing CSS */
    .tabs {
        display: flex;
        margin-bottom: 10px;
        border-bottom: 1px solid #e5e7eb;
    }

    .tab {
        padding: 8px 16px;
        border: none;
        background: none;
        cursor: pointer;
        color: #6b7280;
        font-weight: 500;
        transition: all 0.2s;
    }

    .tab:hover {
        color: #3b82f6;
    }

    .tab.active {
        color: #3b82f6;
        border-bottom: 2px solid #3b82f6;
    }

    .share-tab-content {
        display: none;
    }

    .share-tab-content.active {
        display: block;
    }

    .groups-list {
        max-height: 300px;
        overflow-y: auto;
    }

    .group-item {
        display: flex;
        align-items: center;
        padding: 8px;
        margin: 4px 0;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .group-item:hover {
        background-color: #f3f4f6;
    }

    .group-item.selected {
        background-color: #e5e7eb;
    }

    .group-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background-color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        font-weight: 600;
        color: #4b5563;
    }

    .group-info {
        flex: 1;
    }

    .group-name {
        font-weight: 500;
        color: #1f2937;
    }

    .group-members {
        font-size: 12px;
        color: #6b7280;
    }
    </style>
</body>
</html>
