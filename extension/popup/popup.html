<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkDrop</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading" class="screen">
            <div class="spinner"></div>
            <p>Loading LinkDrop...</p>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="screen hidden">
            <div class="header">
                <h1>LinkDrop</h1>
                <p>Sign in to share links</p>
            </div>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required autocomplete="email">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Sign In</button>
            </form>
            <p class="toggle-auth">
                Don't have an account? 
                <a href="#" id="show-register">Sign up</a>
            </p>
        </div>

        <!-- Register Screen -->
        <div id="register-screen" class="screen hidden">
            <div class="header">
                <h1>Join LinkDrop</h1>
                <p>Create your account</p>
            </div>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Username" required autocomplete="username">
                <input type="email" id="reg-email" placeholder="Email" required autocomplete="email">
                <input type="password" id="reg-password" placeholder="Password" required autocomplete="new-password">
                <button type="submit">Sign Up</button>
            </form>
            <p class="toggle-auth">
                Already have an account? 
                <a href="#" id="show-login">Sign in</a>
            </p>
        </div>

        <!-- Main Screen -->
        <div id="main-screen" class="screen hidden">
            <div class="header">
                <div class="user-info">
                    <span id="username">Loading...</span>
                    <a href="#" id="actual-logout-btn" class="logout-link" style="margin-left: 10px; text-decoration: underline; color: #ff4d4d;">Logout</a>
                    <button id="close-popup-btn" class="close-popup">×</button>
                </div>
                <div class="notification-badge" id="notification-badge">0</div>
            </div>

            <div class="current-tab" id="current-tab">
                <div class="tab-info">
                    <img id="tab-favicon" class="favicon" src="" alt="">
                    <div class="tab-details">
                        <h3 id="tab-title">Loading...</h3>
                        <p id="tab-url">Loading...</p>
                    </div>
                </div>
            </div>

            <div class="share-section">
                <h3>Share with friends</h3>
                <div class="friends-list" id="friends-list">
                    <p class="loading">Loading friends...</p>
                </div>
                <button id="share-btn" class="share-btn" disabled>
                    Share Link
                </button>
            </div>

            <div class="recent-links">
                <h3>Recent links</h3>
                <div class="links-list" id="links-list">
                    <p class="loading">Loading...</p>
                </div>
            </div>

            <div class="footer">
                <button id="open-dashboard" class="dashboard-btn">
                    Open Dashboard
                </button>
            </div>
        </div>

        <!-- Error Messages -->
        <div id="error-message" class="error hidden"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
